[package]
name = "jot-desktop"
version = "0.1.0"
description = "Jot: a plain-text journal, as a desktop app"
edition = "2021"
publish = false

[lib]
# the mobile builds load the app as a library
name = "jot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
