# Publishes site/dist/ to GitHub Pages from main, only after the privacy check and the tests pass.
# Pull requests run the same checks without publishing. Turn Pages on once: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftotext (the privacy check reads PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Privacy check
        run: node tools/privacy-check.mjs site/dist

      - name: The site is built from the current sources
        run: |
          node tools/build-handwriting-css.mjs --check
          node tools/sync-roadmap.mjs --check
          node site/build-guides.mjs --check
          node tools/build-examples.mjs --check
          node tools/manifest.cjs --check
          cmp converter/convert.mjs site/dist/jot/convert.mjs
          for f in jot container proofread charts preview handwriting styles export automation connect vendor/chart vendor/marked; do cmp parser/$f.mjs site/dist/jot/$f.mjs; done
          diff -r parser/fonts site/dist/jot/fonts
          node vscode/sync.mjs --check
          python3 tools/build-parser-zip.py --check

      - name: Lint
        run: npm ci && npm run lint

      - name: Tests
        run: |
          node --test tools/test-privacy.mjs converter/test.mjs tools/test-files.mjs parser/test.mjs parser/proofread-test.mjs parser/container-test.mjs parser/charts-test.mjs parser/formatting-test.mjs parser/handwriting-test.mjs parser/styles-test.mjs parser/automation-test.mjs parser/links-test.mjs cli/test.mjs site/test-editor.mjs site/test-guides.mjs site/test-music.mjs vscode/test-extension.mjs
          node site/test-core.cjs

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
