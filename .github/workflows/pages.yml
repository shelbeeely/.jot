# Publishes site/dist/ to GitHub Pages from main, only after the privacy check and the tests pass.
# Pull requests run the same checks without publishing. Turn Pages on once: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fonts/requirements.txt
      - name: Install font generation tools
        run: python3 -m pip install --disable-pip-version-check -r fonts/requirements.txt
      - name: Install pdftotext (the privacy check reads PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Privacy check
        run: node tools/privacy-check.mjs site/dist

      - name: Original fonts match their sources
        run: |
          python3 fonts/build.py --check
          node tools/sync-fonts.mjs --check
          python3 fonts/test.py

      - name: The site is built from the current sources
        run: |
          node tools/sync-navigation.mjs --check
          node tools/sync-parser.mjs --check
          node tools/sync-archive-specs.mjs --check
          node tools/build-archive-examples.mjs --check
          node tools/build-handwriting-css.mjs --check
          node tools/sync-roadmap.mjs --check
          node tools/build-methods-index.mjs --check
          node tools/build-rendering-profiles.mjs --check
          node tools/check-methods.mjs
          node tools/sync-brand.mjs --check
          node site/build-guides.mjs --check
          node tools/build-examples.mjs --check
          node tools/build-offline.mjs --check
          node tools/manifest.cjs --check
          cmp converter/convert.mjs site/dist/jot/convert.mjs
          cmp converter/archive.mjs site/dist/jot/archive.mjs
          for f in jot timezone container lock proofread charts preview handwriting styles palette export automation connect include query health model3d model3d-view card epub vendor/chart vendor/marked vendor/three; do cmp parser/$f.mjs site/dist/jot/$f.mjs; done
          diff -r parser/fonts site/dist/jot/fonts
          node vscode/sync.mjs --check
          python3 tools/build-parser-zip.py --check

      - name: Lint
        run: npm ci && npm run lint

      - name: Tests
        run: |
          node --test tools/test-methods.mjs
          node --test tools/test-privacy.mjs converter/test.mjs converter/archive-test.mjs tools/test-files.mjs tools/test-profiles.mjs parser/test.mjs parser/proofread-test.mjs parser/container-test.mjs parser/archive-test.mjs parser/lock-test.mjs parser/charts-test.mjs parser/formatting-test.mjs parser/handwriting-test.mjs parser/styles-test.mjs parser/palette-test.mjs parser/automation-test.mjs parser/include-test.mjs parser/links-test.mjs parser/query-test.mjs parser/health-test.mjs cli/test.mjs site/test-editor.mjs site/test-ai-client.mjs site/test-voice-writing.mjs site/test-passkey-client.mjs site/test-browser-tools.mjs site/test-connected-sources.mjs site/test-home-assistant-source.mjs site/test-autocomplete.mjs site/test-device-files.mjs site/test-editor-capture.mjs site/test-live-model.mjs site/test-reference-books.mjs site/test-writer-search.mjs site/test-writer-templates.mjs site/test-writer-workspace.mjs site/test-entry-pen.mjs site/test-scribe.mjs site/test-scratchpad.mjs site/test-media-catalog.mjs site/test-media-shelf.mjs site/test-writing-tools.mjs site/test-guides.mjs site/test-page-view.mjs site/test-scene-journal.mjs site/test-music.mjs site/test-voice.mjs vscode/test-extension.mjs
          node site/test-core.cjs

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
